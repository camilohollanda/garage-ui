name: build-fork-ghcr

# Builds the image from this fork and pushes it to this fork's GitHub Container
# Registry (GHCR) using the built-in GITHUB_TOKEN — no Docker Hub secrets needed.
# Runs automatically on pushes to the feature branch, and can be triggered
# manually from the Actions tab (Run workflow) for any branch.

on:
  push:
    branches:
      - fork/ghcr-image
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Resolves to ghcr.io/<owner>/<repo>, lowercased automatically.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=bulk-delete
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=bulk-delete
          cache-from: type=gha
          cache-to: type=gha,mode=max
